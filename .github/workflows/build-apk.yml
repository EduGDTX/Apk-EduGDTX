name: Build APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Dia chi HTTPS cua server EduGDTX (vi du https://edugdtx.example.com)"
        required: true
        type: string
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tao project Capacitor
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          case "$SERVER_URL" in http://*|https://*) ;; *) echo "Dia chi phai bat dau bang https://"; exit 1;; esac
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          echo '<!doctype html><html><body>EduGDTX</body></html>' > www/index.html
          node -e "const u=process.env.SERVER_URL;require('fs').writeFileSync('capacitor.config.json',JSON.stringify({appId:'vn.edugdtx.mobile',appName:'EduGDTX',webDir:'www',server:{url:u,cleartext:u.startsWith('http://')}},null,2))"
          npx cap add android
          npx cap sync android
      - name: Build APK (debug)
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EduGDTX-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
