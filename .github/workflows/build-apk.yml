name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edugdtx-apk-repo
    steps:
      - uses: actions/checkout@v4
      - name: Kiem tra da sua server.url
        run: |
          if grep -q "THAY-BANG" capacitor.config.json; then echo "Chua sua server.url trong capacitor.config.json"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK (debug)
        run: ./gradlew assembleDebug
        working-directory: edugdtx-apk-repo/android
      - uses: actions/upload-artifact@v4
        with:
          name: EduGDTX-apk
          path: edugdtx-apk-repo/android/app/build/outputs/apk/debug/app-debug.apk
